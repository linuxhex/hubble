server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: cloud-eyes-api

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:hubble;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;LOCK_TIMEOUT=5000
    username: sa
    password:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 5000
  sql:
    init:
      mode: always

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

# 运维大盘配置
monitor:
  scan-interval-seconds: 5
  snapshot-retention: 1440
  default-query-logstore: all
  error-scan-lines: 200
  minute-red-threshold: 50
  minute-yellow-threshold: 20
  dashboard-url: ${MONITOR_DASHBOARD_URL:http://localhost:5173}

# 阿里云SLS配置
aliyun:
  sls:
    access-key-id: ${ALIYUN_SLS_ACCESS_KEY_ID}
    access-key-secret: ${ALIYUN_SLS_ACCESS_KEY_SECRET}
    endpoint: ${ALIYUN_SLS_ENDPOINT:cn-hangzhou.log.aliyuncs.com}
    project: ${ALIYUN_SLS_PROJECT}
    query:
      max-results: 100
      timeout-seconds: 30
      global-timeout-seconds: 15
      retry-times: 3
    thread-pool:
      core-size: 8
      max-size: 16
      queue-capacity: 100
  arms:
    access-key-id: ${ARMS_AK_ID:${ALIYUN_SLS_ACCESS_KEY_ID:}}
    access-key-secret: ${ARMS_AK_SECRET:${ALIYUN_SLS_ACCESS_KEY_SECRET:}}
    region: ${ARMS_REGION:cn-hangzhou}

# Grafana 配置（Pod/Node 监控）
grafana:
  url: ${GRAFANA_URL:https://graf.ykccn.net}
  user: ${GRAFANA_USER:caomunian}
  pass: ${GRAFANA_PASS:}
  ds-uid: ${GRAFANA_DS_UID:6A__NzsMk}
  node-ds-uid: ${GRAFANA_NODE_DS_UID:cem0jt0mij668b}

# 父系统集成配置
parent-system:
  api-url: ${PARENT_SYSTEM_API_URL:http://parent-system.example.com/api}
  jwt:
    public-key: ${JWT_PUBLIC_KEY:CloudEyesJwtSecretKeyForHMACSHA256AlgorithmMustBeAtLeast32Bytes}
    expiration: ${JWT_EXPIRATION:3600000}

# 钉钉配置
dingtalk:
  app-key: ${DINGTALK_APP_KEY:your-dingtalk-app-key}
  app-secret: ${DINGTALK_APP_SECRET:your-dingtalk-app-secret}
  redirect-url: ${DINGTALK_REDIRECT_URL:http://localhost:8778/query}
  access-token-url: https://api.dingtalk.com/v1.0/oauth2/userAccessToken
  user-info-url: https://api.dingtalk.com/v1.0/contact/users/me
  robot-webhook: ${DINGTALK_ROBOT_WEBHOOK:}
  robot-secret: ${DINGTALK_ROBOT_SECRET:}

# Milvus配置
milvus:
  enabled: ${MILVUS_ENABLED:false}
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  username: ${MILVUS_USERNAME:root}
  password: ${MILVUS_PASSWORD:milvus_password}
  database: ${MILVUS_DATABASE:devops}
  vector-dimension: ${MILVUS_VECTOR_DIMENSION:1024}

# 阿里云DashScope配置
dashscope:
  apiKey: ${DASHSCOPE_API_KEY:your-dashscope-api-key}
  embeddingModel: text-embedding-v3

# SpringDoc OpenAPI配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    com.ykc.cloudeyes: DEBUG
    org.springframework.web: INFO
  file:
    name: logs/cloud-eyes.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
