server:
  port: 18081

spring:
  application:
    name: cloud-eyes-api
  config:
    import: optional:classpath:.env[.properties]

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:${HUBBLE_DB_PATH:./data/hubble};MODE=MySQL;DATABASE_TO_LOWER=TRUE;LOCK_TIMEOUT=5000
    username: sa
    password:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
  sql:
    init:
      mode: always

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

# 运维大盘配置
monitor:
  scan-interval-seconds: 5
  snapshot-retention: 1440
  default-query-logstore: all
  error-scan-lines: 200
  minute-red-threshold: 50
  minute-yellow-threshold: 20
  dashboard-url: ${MONITOR_DASHBOARD_URL:http://localhost:82}

# 阿里云SLS配置
aliyun:
  sls:
    access-key-id: ${ALIYUN_SLS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_SLS_ACCESS_KEY_SECRET:}
    endpoint: ${ALIYUN_SLS_ENDPOINT:cn-hangzhou.log.aliyuncs.com}
    project: ${ALIYUN_SLS_PROJECT:}
    # AI 排查工具多环境 project 映射（未配置的环境回落到上面的 project）
    projects:
      prod: ${SLS_PROJECT_PROD:}
      uat: ${SLS_PROJECT_UAT:}
      test: ${SLS_PROJECT_TEST:}
    query:
      max-results: 100
      timeout-seconds: 30
      global-timeout-seconds: 15
      retry-times: 3
    thread-pool:
      core-size: 8
      max-size: 16
      queue-capacity: 100
  arms:
    access-key-id: ${ARMS_AK_ID:${ALIYUN_SLS_ACCESS_KEY_ID:}}
    access-key-secret: ${ARMS_AK_SECRET:${ALIYUN_SLS_ACCESS_KEY_SECRET:}}
    region: ${ARMS_REGION:cn-hangzhou}

# Grafana 配置（Pod/Node 监控）
grafana:
  url: ${GRAFANA_URL:}
  user: ${GRAFANA_USER:admin}
  pass: ${GRAFANA_PASS:}
  api-key: ${GRAFANA_API_KEY:}
  ds-uid: ${GRAFANA_DS_UID:}
  node-ds-uid: ${GRAFANA_NODE_DS_UID:}
  aliyun-ds-uid: ${GRAFANA_ALIYUN_DS_UID:}
  biz-ds-uid: ${GRAFANA_BIZ_DS_UID:}

# 中间件实例配置（CloudMonitor 通用查询，无需独立 SDK）
middleware:
  rocketmq:
    instances:
      - instance-id: ${ROCKETMQ_INSTANCE_ID:}
        instance-name: ${ROCKETMQ_INSTANCE_NAME:prod-rocketmq}
        topic: ${ROCKETMQ_TOPIC:}
  kafka:
    instances:
      - instance-id: ${KAFKA_INSTANCE_ID:}
        instance-name: ${KAFKA_INSTANCE_NAME:prod-kafka}
        topic: ${KAFKA_TOPIC:}
  lindorm:
    instances:
      - instance-id: ${LINDORM_INSTANCE_ID:}
        instance-name: ${LINDORM_INSTANCE_NAME:prod-lindorm}
  elasticsearch:
    instances:
      - instance-id: ${ES_INSTANCE_ID:}
        instance-name: ${ES_INSTANCE_NAME:prod-es}
  oss:
    buckets:
      - bucket-name: ${OSS_BUCKET_NAME:}
        instance-name: ${OSS_INSTANCE_NAME:prod-oss}

# 父系统集成配置
parent-system:
  api-url: ${PARENT_SYSTEM_API_URL:http://parent-system.example.com/api}
  jwt:
    public-key: ${JWT_PUBLIC_KEY:}
    expiration: ${JWT_EXPIRATION:3600000}

# 业务监控配置
biz-analysis:
  allowed-users: ${BIZ_ANALYSIS_USERS:}
  query-server-url: ${MCP_BASE_URL:http://query-server-internal:8080}
  query-user: ${MCP_USER:}
  query-pass: ${MCP_PASS:}

# 钉钉配置
dingtalk:
  app-key: ${DINGTALK_APP_KEY:your-dingtalk-app-key}
  app-secret: ${DINGTALK_APP_SECRET:your-dingtalk-app-secret}
  redirect-url: ${DINGTALK_REDIRECT_URL:http://localhost:8778/query}
  access-token-url: https://api.dingtalk.com/v1.0/oauth2/userAccessToken
  user-info-url: https://api.dingtalk.com/v1.0/contact/users/me
  robot-webhook: ${DINGTALK_ROBOT_WEBHOOK:}
  robot-secret: ${DINGTALK_ROBOT_SECRET:}

# 服务负载监控
service-load:
  app-map: ${SERVICE_LOAD_APP_MAP:}
  fallback-services: ${SERVICE_LOAD_FALLBACK_SERVICES:}
  # 启动时自动补采最近缺天数据（需内网 Prometheus/SLS 可达，连续2日失败自动熔断）
  backfill-on-startup: ${SERVICE_LOAD_BACKFILL:true}
  backfill-days: ${SERVICE_LOAD_BACKFILL_DAYS:14}

# 网关大盘
gateway:
  core-services: ${GATEWAY_CORE_SERVICES:}
  known-services: ${GATEWAY_KNOWN_SERVICES:}

# 链路追踪
trace:
  gateway-container: ${TRACE_GATEWAY_CONTAINER:}
  fallback-services: ${TRACE_FALLBACK_SERVICES:}

# Milvus配置
milvus:
  enabled: ${MILVUS_ENABLED:false}
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  username: ${MILVUS_USERNAME:root}
  password: ${MILVUS_PASSWORD:}
  database: ${MILVUS_DATABASE:devops}
  vector-dimension: ${MILVUS_VECTOR_DIMENSION:1024}

# 阿里云DashScope配置（仅 embedding 使用；AI 对话已切换到 llm.* 内部网关）
dashscope:
  apiKey: ${DASHSCOPE_API_KEY:your-dashscope-api-key}
  embeddingModel: text-embedding-v3

# AI 对话 LLM 配置（OpenAI 兼容协议，内部网关）
llm:
  base-url: ${LLM_BASE_URL:http://10.20.0.239:3020/v1}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:glm-5.2}

# AI 助手 Agent 配置（排查工具）
agent:
  # 代码检索工作区根目录（为空则 AI 对话的代码检索工具不可用）
  code-workspace: ${HUBBLE_CODE_WORKSPACE:}
  # 单次对话最大工具调用轮次
  max-tool-rounds: 8
  nacos-script-path: ${NACOS_SCRIPT_PATH:${user.home}/.qoder/skills/cwork-config/scripts/nacos_query.sh}

# SpringDoc OpenAPI配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    com.ykc.cloudeyes: DEBUG
    org.springframework.web: INFO
  file:
    name: logs/cloud-eyes.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
